name: Build Teresa QuickCall APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the project
        run: unzip -q TeresaQuickCall-Phase1.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        working-directory: TeresaQuickCall
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        working-directory: TeresaQuickCall
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TeresaQuickCall-debug-apk
          path: TeresaQuickCall/app/build/outputs/apk/debug/app-debug.apk
